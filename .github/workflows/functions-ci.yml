name: Center Backend CI
on:
  pull_request:
  push:
    branches: [main, fix/full-review-2026-11]
jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json
      - run: npm install
      - run: npm test
